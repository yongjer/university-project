; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = uno

; Firmware for the robot (Arduino Uno).
;   pio run -e uno                  build
;   pio run -e uno -t upload        flash
;   pio device monitor -b 115200    talk to the robot by hand
[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps = waspinator/AccelStepper@^1.64
monitor_speed = 115200
build_flags =
    -D SERIAL_BAUD=115200
    -D STEPPER_SPEED_SPS=3000
    -D STEPPER_MODE=0

; Host-side unit tests for the hardware-independent core (lib/robot_core).
;   pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra -Werror
