[project]
name = "voice-robot"
version = "2.0.0"
description = "Jetson-side controller for a voice-controlled robot: ASR -> intent parsing -> serial motion control."
readme = "README.md"
authors = [{ name = "Yong-Jer Chuang", email = "jerjer920813@gmail.com" }]
license = { text = "GPL-3.0-only" }
# JetPack 6 ships Python 3.10, so stay compatible with it.
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyserial>=3.5",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Speech recognition through the Gradio API of the ASR container (ai_server/).
asr = ["gradio-client>=1.3"]

[project.scripts]
voice-robot = "voice_robot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Blocking calls and polling are fine in short-lived test scenarios.
"tests/*" = ["ASYNC"]
